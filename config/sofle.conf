CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# Deshabilitar widgets integrados para evitar conflictos
# CONFIG_ZMK_WIDGET_LAYER_STATUS is not set
# CONFIG_ZMK_WIDGET_BATTERY_STATUS is not set
# CONFIG_ZMK_WIDGET_OUTPUT_STATUS is not set
# CONFIG_ZMK_WIDGET_WPM_STATUS is not set
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE is not set

# Soporte para encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Opciones adicionales
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Latency optimization:
# ZMK_BLE_EXPERIMENTAL_CONN disables the 2M BLE PHY. Keep it off here so
# the nRF52840 can use the faster 2M PHY when the host supports it.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=n

# Split-half BLE: use zero peripheral latency so the split does not skip
# connection events. This favors responsiveness over battery life.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0

CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10
